<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <title>网站已搬迁 · 霸中GakuseiHouse</title>
    
    <link rel="stylesheet" href="css/generall.css">

    <style>
        /* 简单的顶栏样式 */
        .top-bar {
            background: #0f1f3a;
            color: #fff;
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999;
            box-sizing: border-box;
        }
        .top-bar a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }
        .top-bar a:hover {
            text-decoration: underline;
        }
        /* 让卡片不被顶栏挡住 */
        .construction-card {
            margin-top: 80px;
        }
    </style>
</head>
<body>

    <!-- 顶栏 -->
    <div class="top-bar">
        <span> 霸中GakuseiHouse
        </span>
       
    </div>

    <div class="construction-card">
        <div class="icon-wrapper">
            <span>🚧</span>
        </div>

        <div class="title">我们已经架设了新的站点,<em>该网站已关停。</em></div>

        <div class="subtitle-en">The site has been migrated.</div>

        <p class="sub-desc">
            该网站将停止更新，但是您也可以前往我们新的校站，以继续浏览。<br />
        </p>
        <p class="sub-desc">点击下方按钮，前往霸中Kivotos——The 8th Committee</p>

        <a href="http://8thcommittee.cc.cd" class="btn-back">霸中Kivotos→</a>
    </div>

</body>
